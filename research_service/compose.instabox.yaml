# Overlay: docker compose -f compose.yaml -f compose.instabox.yaml ...
services:
  research:
    ports: !override
      - "0.0.0.0:8000:8000"
    volumes: !override
      - ${STOCKLAB_DATA_DIR:-/data/stocklab/research-data}:/data
      - /data/stocklab/kronos/models:/opt/kronos-models:ro
    mem_limit: 4g
    environment:
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/status', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
