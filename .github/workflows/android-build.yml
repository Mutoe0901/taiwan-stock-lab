name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-build.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v0.6.4 source files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const html = fs.readFileSync('web/index.html', 'utf8');
          const js = fs.readFileSync('web/main.js', 'utf8');
          const required = [
            [pkg.version === '0.6.4', `package.json version is ${pkg.version}, expected 0.6.4`],
            [html.includes('v0.6.4'), 'web/index.html does not show v0.6.4'],
            [html.includes('id="quick-chatgpt"'), 'web/index.html is missing the ChatGPT quick button'],
            [html.includes('ChatGPT 深度分析'), 'web/index.html is missing ChatGPT 深度分析 text'],
            [js.includes('ChatGPTLauncher'), 'web/main.js is missing ChatGPT launcher logic'],
            [fs.existsSync('scripts/patch-android-chatgpt.mjs'), 'scripts/patch-android-chatgpt.mjs is missing']
          ];
          const errors = required.filter(([ok]) => !ok).map(([,msg]) => msg);
          if (errors.length) {
            console.error('Release verification failed:');
            for (const e of errors) console.error('- ' + e);
            process.exit(1);
          }
          console.log('Verified: Taiwan Stock Lab v0.6.4');
          console.log('Verified: web/ ChatGPT button and launcher source are present');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install npm dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Add direct ChatGPT launcher
        run: node scripts/patch-android-chatgpt.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: ls -lah android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-stock-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
